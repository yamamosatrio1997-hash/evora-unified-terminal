name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: tcc, POSTGRES_PASSWORD: tcc, POSTGRES_DB: tcc_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tcc" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests --select E,F,W,B --ignore E501,B008,B904
      - run: pytest -q
        env: { DATABASE_URL: "postgresql+psycopg://tcc:tcc@localhost:5432/tcc_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test

  n8n-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import workflows into n8n
        run: |
          docker run --rm -v $PWD/n8n/workflows:/wf:ro -e N8N_ENCRYPTION_KEY=ci-only-key-not-secret \
            -e N8N_DIAGNOSTICS_ENABLED=false --entrypoint sh n8nio/n8n:2.44.6 \
            -c "n8n import:workflow --separate --input=/wf | tee /tmp/out && grep -q 'Successfully imported 8 workflows' /tmp/out"
