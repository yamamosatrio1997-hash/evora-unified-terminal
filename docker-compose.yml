# Target: single VPS, 2 vCPU / 4 GB RAM. Memory limits sum to ~3.1 GB.
name: tcc

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tcc}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=60", "-c", "work_mem=8MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-n8n.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *logging
    networks: [internal]

  backend:
    build: ./backend
    image: tcc-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tcc}
      N8N_BASE_URL: http://n8n:5678
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    cpus: 1.5
    logging: *logging
    networks: [internal, egress]

  frontend:
    build: ./frontend
    image: tcc-frontend:local
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      # Put a TLS-terminating proxy in front (see docs/DEPLOYMENT.md). Bind to all
      # interfaces only if that proxy runs elsewhere.
      - "${FRONTEND_BIND:-127.0.0.1}:8080:8080"
    mem_limit: 128m
    logging: *logging
    networks: [internal, edge]

  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      GENERIC_TIMEZONE: UTC
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_TIMEOUT: "900"
      EXECUTIONS_TIMEOUT_MAX: "1800"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "3"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      # Editor/API reachable only from the host (use an SSH tunnel or VPN).
      - "127.0.0.1:5678:5678"
    mem_limit: 1g
    logging: *logging
    networks: [internal, egress]

  # Optional automatic HTTPS (needed for the Telegram webhook): docker compose --profile tls up -d
  caddy:
    image: caddy:2.8-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-}  # required when using the tls profile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [frontend]
    mem_limit: 128m
    logging: *logging
    networks: [edge]

volumes:
  pgdata:
  n8ndata:
  caddydata:

networks:
  internal:
    internal: true  # postgres is reachable only from app containers
  egress: {}        # outbound internet for market data, LLM, Telegram, MEXC
  edge: {}          # published HTTP port / TLS proxy
