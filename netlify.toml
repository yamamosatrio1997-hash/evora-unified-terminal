# Netlify hosts the static frontend only. The FastAPI backend and Postgres cannot run here;
# until a backend URL is configured, /api answers 503 so the app shows "backend offline"
# instead of parsing index.html as JSON.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# To connect a backend later, replace this rule with a proxy, e.g.
#   from = "/api/*"  to = "https://<backend-host>/api/:splat"  status = 200  force = true
[[redirects]]
  from = "/api/*"
  to = "/backend-offline.json"
  status = 503
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
