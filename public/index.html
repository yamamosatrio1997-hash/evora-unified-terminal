<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yama Futures Lab</title>
  <meta name="description" content="Terminal paper trading bot: ekuitas live, posisi, jurnal, strategi, dan lab prediktif." />
  <meta name="theme-color" content="#070d24" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' rx='1' fill='%23101c48'/%3E%3Cpath d='M1 1h2v2h1V1h2v1H5v2H4v3H3V4H2V2H1z' fill='%2322e39b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="navToggle" aria-label="Buka menu" data-icon="menu"></button>
      <a class="brand" href="#/">
        <canvas class="brand-logo pixel" id="brandLogo" width="16" height="16" aria-hidden="true"></canvas>
        <span class="brand-text">
          <strong>Yama Futures Lab</strong>
          <small>PAPER · 10x · TOP 1000</small>
        </span>
      </a>
      <div class="tagline"><span class="tagline-spark" aria-hidden="true"></span>Langkah kecil. Hasil berlipat.</div>
      <div class="topbar-right">
        <button class="status-pill" id="statusPill" title="Klik untuk jeda / lanjutkan bot">
          <span class="dot"></span><span class="status-label">Memuat status engine</span>
          <span class="status-clock" id="clock">--:--:--</span>
        </button>
        <button class="icon-btn" id="bellBtn" aria-label="Notifikasi" data-icon="bell"><span class="badge" id="bellBadge" hidden>0</span></button>
        <div class="popover-wrap">
          <button class="icon-btn" id="settingsBtn" aria-label="Pengaturan" data-icon="settings"></button>
          <div class="popover" id="settingsPop" hidden>
            <label class="toggle"><input type="checkbox" id="optHide" /><span></span>Sembunyikan nominal</label>
            <label class="toggle"><input type="checkbox" id="optMotion" /><span></span>Kurangi animasi</label>
            <label class="toggle"><input type="checkbox" id="optToast" checked /><span></span>Notifikasi trade</label>
          </div>
        </div>
        <div class="avatar" aria-hidden="true" data-icon="user"></div>
      </div>
    </header>

    <nav class="sidebar" id="sidebar">
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-foot">
        <div class="bubble"><span id="bubbleText">Ayo tangkap peluang bersama!</span></div>
        <canvas class="pixel mascot" id="mascot" width="120" height="96" aria-hidden="true"></canvas>
      </div>
    </nav>

    <main class="main" id="view" tabindex="-1"></main>

    <aside class="rail" id="rail">
      <section class="card logs-card">
        <header class="card-head">
          <h3>Live Logs</h3>
          <a href="#/jurnal" class="link">Lihat semua <i data-icon="arrowRight"></i></a>
        </header>
        <ol class="logs" id="logs"></ol>
      </section>
      <section class="card pairs-card">
        <header class="card-head"><h3>Top Pairs</h3><span class="muted small" id="pairsSource">simulasi</span></header>
        <div class="pairs-head"><span>Pair</span><span>24j</span><span>Status</span></div>
        <ul class="pairs" id="pairs"></ul>
      </section>
      <section class="card promo">
        <canvas class="pixel promo-scene" id="sunset" width="160" height="90" aria-hidden="true"></canvas>
        <div class="promo-text">Trade yang baik<br />membangun kebebasan</div>
      </section>
    </aside>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="conn-banner" id="connBanner" hidden>Koneksi live terputus, mencoba lagi…</div>
  <div class="conn-banner data-banner" id="dataBanner" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
